services:
  royaume-app:
    build:
      context: ./demo
      args:
        DEVONN_REGISTRY_USERNAME: ${DEVONN_REGISTRY_USERNAME}
        DEVONN_REGISTRY_PASSWORD: ${DEVONN_REGISTRY_PASSWORD}
    image: royaume-app:latest
    depends_on:
      - postgres
      - otel-collector
    ports:
      - "8080:8080"
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker,${APP_MODE}
      OTEL_TRACES_EXPORTER_ENDPOINT: ${OTEL_TRACES_EXPORTER_ENDPOINT}
      OTEL_METRICS_EXPORTER_ENDPOINT: ${OTEL_METRICS_EXPORTER_ENDPOINT}
      ROYAUME_PROFESSOR_FETCH_DELAY: ${ROYAUME_PROFESSOR_FETCH_DELAY}
      LOG_FILE: /app/logs/royaume-quests.json
    volumes:
      - app_logs:/app/logs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector:0.98.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      - jaeger
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  kibana-init:
    image: curlimages/curl:8.6.0
    depends_on:
      - kibana
    environment:
      KIBANA_URL: http://kibana:5601
    command:
      - /bin/sh
      - -c
      - |
        set -e
        body='{"data_view":{"title":"royaume-quests-*","name":"Royaume Quests","timeFieldName":"@timestamp"}}'
        max=$${MAX_RETRIES:-30}
        delay=5
        i=1
        echo "Starting kibana-init with KIBANA_URL=$${KIBANA_URL} max=$${max}"
        while [ $$i -le $$max ]; do
          if curl -s -o /dev/null "$${KIBANA_URL}/api/status"; then
            resp=$$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$${KIBANA_URL}/api/data_views/data_view" \
              -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
              -d "$$body")
            echo "Attempt $$i/$${max}: status $$resp"
            if [ "$$resp" = "200" ] || [ "$$resp" = "409" ]; then
              echo "Kibana data view ensured (status $$resp)"; exit 0;
            else
              echo "Creation failed (status $$resp):"; cat /tmp/resp.json;
            fi
          else
            echo "Kibana not ready yet ($$i/$${max})"
          fi
            i=$$((i+1)); sleep $$delay
        done
        echo "Kibana init failed after $$max attempts"; exit 1

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    user: root
    depends_on:
      - elasticsearch
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./logging/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app_logs:/logs:ro

  gatling:
    profiles: ["bench"]
    build:
      context: ./demo/demo-gatling
      dockerfile: Dockerfile
    depends_on:
      - royaume-app
    environment:
      API_BASE_URL: ${GATLING_API_BASE_URL}
      API_URI: ${GATLING_API_URI}
      QUESTS_BASE_PATH: ${GATLING_QUESTS_BASE_PATH}
      LAUNCH_DELAY_MS: ${GATLING_LAUNCH_DELAY_MS}
      GATLING_SIMULATION_CLASS: ${GATLING_SIMULATION_CLASS}
      USERS: ${GATLING_USERS}
      DURATION_SECONDS: ${GATLING_DURATION_SECONDS}
      THINK_TIME_MS: ${GATLING_THINK_TIME_MS}
      WARMUP_TIMEOUT_SECONDS: ${GATLING_WARMUP_TIMEOUT_SECONDS}
    volumes:
      - ./demo/demo-gatling/result:/opt/gatling/results

volumes:
  postgres_data:
  app_logs:
  es_data:
  grafana_data:
  prometheus_data:
