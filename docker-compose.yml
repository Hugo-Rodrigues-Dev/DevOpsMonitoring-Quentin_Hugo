services:
  royaume-app:
    build:
      context: ./demo
      args:
        DEVONN_REGISTRY_USERNAME: ${DEVONN_REGISTRY_USERNAME}
        DEVONN_REGISTRY_PASSWORD: ${DEVONN_REGISTRY_PASSWORD}
    image: royaume-app:latest
    depends_on:
      - postgres
      - otel-collector
    ports:
      - "8080:8080"
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker,${APP_MODE:-auto}
      OTEL_TRACES_EXPORTER_ENDPOINT: ${OTEL_TRACES_EXPORTER_ENDPOINT}
      OTEL_METRICS_EXPORTER_ENDPOINT: ${OTEL_METRICS_EXPORTER_ENDPOINT}
    volumes:
      - app_logs:/app/logs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: royaume
      POSTGRES_USER: royaume
      POSTGRES_PASSWORD: royaume
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector:0.98.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      - jaeger
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    depends_on:
      - elasticsearch
    volumes:
      - ./logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "9600:9600"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    user: root
    depends_on:
      - logstash
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./logging/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app_logs:/logs:ro

volumes:
  postgres_data:
  app_logs:
  es_data:
  grafana_data:
  prometheus_data:
