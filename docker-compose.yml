services:
  royaume-app:
    build:
      context: ./demo
      args:
        DEVONN_REGISTRY_USERNAME: ${DEVONN_REGISTRY_USERNAME}
        DEVONN_REGISTRY_PASSWORD: ${DEVONN_REGISTRY_PASSWORD}
    image: royaume-app:latest
    ports:
      - "8080:8080"
      - "8090:8090"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker,${APP_MODE:-auto}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: royaume
      POSTGRES_USER: royaume
      POSTGRES_PASSWORD: royaume
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
