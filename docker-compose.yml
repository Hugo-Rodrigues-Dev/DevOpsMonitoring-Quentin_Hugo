services:
  royaume-app:
    build:
      context: ./demo
    image: royaume-app:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      APP_MODE: ${APP_MODE:-AUTO}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: royaume
      POSTGRES_USER: royaume
      POSTGRES_PASSWORD: royaume
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
