receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  resource/service-name:
    attributes:
      - key: service.name
        value: observabilia-quentin-hugo
        action: upsert
      - key: service.namespace
        value: observabilia
        action: upsert
  batch: {}

exporters:
  logging:
    loglevel: info
  otlp/jaeger-local:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlphttp/jaeger-prof:
    endpoint: https://jaeger-http.devonn.io

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/service-name, batch]
      exporters: [logging, otlp/jaeger-local, otlphttp/jaeger-prof]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
